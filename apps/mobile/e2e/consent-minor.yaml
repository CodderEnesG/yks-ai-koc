# T21: 18 yaş altı öğrenci veli onayı ister; veli web sayfasında (simülatör Safari'si) e-posta koduyla
# onay verir; öğrenci hesap bağlar ve yedekler; veli onayı geri çeker. Yerel Supabase, Mailpit ve
# apps/web (`pnpm --filter @yks/web dev`, localhost:3000) açık olmalı.
appId: dev.placeholder.ykskoc
---
- evalScript: ${output.parentEmail = 'veli-' + Date.now() + '@test.local'}
- runFlow: _onboard-minor.yaml
- assertVisible: { id: today-consent }

# 1. Öğrenci linki oluşturur.
- tapOn: { id: today-consent }
- tapOn: { id: consent-email }
- inputText: ${output.parentEmail}
- tapOn: { id: continue }
- extendedWaitUntil:
    visible: { id: consent-link }
    timeout: 10000
- copyTextFrom: { id: consent-link }
- evalScript: ${output.link = maestro.copiedText}
- tapOn: { id: consent-check }
- assertVisible: { id: consent-pending }

# 2. Veli sayfayı açar ve onay verir.
- runScript: scripts/clear-mail.js
- openLink: ${output.link}
- extendedWaitUntil:
    visible: 'Aydınlatma metni.*'
    timeout: 20000
# Web görünümünde ekran dışındaki öğe de "görünür" sayılır; dokunmadan önce ortaya kaydır.
- scrollUntilVisible:
    element: 'AI ve yurt dışı aktarım rızası'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'AI ve yurt dışı aktarım rızası'
- assertVisible:
    text: 'AI ve yurt dışı aktarım rızası'
    checked: true
- scrollUntilVisible:
    element: 'Adınız ve soyadınız'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'Adınız ve soyadınız'
- inputText: 'Ayşe Yılmaz'
- tapOn: 'E-posta adresiniz.*'
- inputText: ${output.parentEmail}
- scrollUntilVisible:
    element: 'Doğrulama kodu gönder'
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    text: 'Doğrulama kodu gönder'
    enabled: true
- tapOn: 'Doğrulama kodu gönder'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/read-otp.js
      - assertTrue: ${output.otp && output.otp.length === 6}
- tapOn: 'E-postanıza gelen.*'
- inputText: ${output.otp}
- tapOn: 'Onay veriyorum'
- extendedWaitUntil:
    visible: 'Onay verildi.*'
    timeout: 15000

# 3. Öğrenci uygulamaya döner: onay görünür, hesap bağlanır ve yedek sunucuya yazılır.
- launchApp
- tapOn: 'Ayarlar'
- extendedWaitUntil:
    visible: { id: account-connect }
    timeout: 15000
- runFlow: _connect-account.yaml
- tapOn: { id: sync-now }
- extendedWaitUntil:
    visible: { id: sync-status }
    timeout: 15000
- assertNotVisible: 'Yedeklenemedi.*'

# 4. Veli onayı geri çeker: öğrencinin sunucu hesabı silinir, uygulama yerel moda döner.
- runScript: scripts/clear-mail.js
- openLink: ${output.link}
- extendedWaitUntil:
    visible: 'Onay verildi.*'
    timeout: 20000
- tapOn: 'Onayı geri çekmek istiyorum'
- tapOn: 'E-posta adresiniz.*'
- inputText: ${output.parentEmail}
- tapOn: 'Doğrulama kodu gönder'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/read-otp.js
      - assertTrue: ${output.otp && output.otp.length === 6}
- tapOn: 'E-postanıza gelen.*'
- inputText: ${output.otp}
- tapOn: 'Onayı geri çek'
- extendedWaitUntil:
    visible: 'Onay geri çekildi.*'
    timeout: 15000
- launchApp
- tapOn: 'Ayarlar'
- extendedWaitUntil:
    visible: 'Velin onayını geri çekti.*'
    timeout: 15000
