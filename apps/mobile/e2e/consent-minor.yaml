# T21: 18 yaş altı öğrenci veli onayı ister; veli web sayfasında (simülatör Safari'si) e-posta koduyla
# onay verir; öğrenci hesap bağlar ve yedekler; veli onayı geri çeker. Yerel Supabase, Mailpit ve
# apps/web (`pnpm --filter @yks/web dev`, localhost:3000) açık olmalı.
appId: dev.placeholder.ykskoc
---
- evalScript: ${output.parentEmail = 'veli-' + Date.now() + '@test.local'}
- runFlow: _onboard-minor.yaml
- assertVisible: { id: today-consent }

- runFlow:
    file: _consent-grant.yaml
    env:
      REPORT: 'false'

# 4. Veli onayı geri çeker: öğrencinin sunucu hesabı silinir, uygulama yerel moda döner.
- runScript: scripts/clear-mail.js
- openLink: ${output.link}
- extendedWaitUntil:
    visible: 'Onay verildi.*'
    timeout: 20000
- tapOn: 'Onayı geri çekmek istiyorum'
- tapOn: 'E-posta adresiniz.*'
- inputText: ${output.parentEmail}
- tapOn: 'Done'
- tapOn: 'Doğrulama kodu gönder'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/read-otp.js
      - assertTrue: ${output.otp && output.otp.length === 6}
- tapOn: 'E-postanıza gelen.*'
- inputText: ${output.otp}
- tapOn: 'Onayı geri çek'
- extendedWaitUntil:
    visible: 'Onay geri çekildi.*'
    timeout: 15000
- launchApp
- tapOn: { id: settings-open }
- extendedWaitUntil:
    visible: 'Velin onayını geri çekti.*'
    timeout: 15000
