# Onay bekleyen öğrenci: link oluştur → veli Safari'de onay verir (REPORT=true ise rapor rızası da) →
# uygulamada hesap bağlanır ve yedeklenir. Önce output.parentEmail tanımlanmalı. output.link kalır.
appId: dev.placeholder.ykskoc
---
# 1. Öğrenci linki oluşturur.
- tapOn: { id: today-consent }
- tapOn: { id: consent-email }
- inputText: ${output.parentEmail}
- tapOn: { id: continue }
- extendedWaitUntil:
    visible: { id: consent-link }
    timeout: 10000
- copyTextFrom: { id: consent-link }
- evalScript: ${output.link = maestro.copiedText}
- tapOn: { id: consent-check }
- assertVisible: { id: consent-pending }

# 2. Veli sayfayı açar ve onay verir.
- runScript: scripts/clear-mail.js
- openLink: ${output.link}
- extendedWaitUntil:
    visible: 'Aydınlatma metni.*'
    timeout: 20000
# Web görünümünde ekran dışındaki öğe de "görünür" sayılır; dokunmadan önce ortaya kaydır.
- scrollUntilVisible:
    element: 'AI ve yurt dışı aktarım rızası'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'AI ve yurt dışı aktarım rızası'
- assertVisible:
    text: 'AI ve yurt dışı aktarım rızası'
    checked: true
- runFlow:
    when:
      true: ${REPORT == 'true'}
    commands:
      - scrollUntilVisible:
          element: 'Haftalık rapor rızası'
          visibilityPercentage: 100
          centerElement: true
      - tapOn: 'Haftalık rapor rızası'
      - assertVisible:
          text: 'Haftalık rapor rızası'
          checked: true
- scrollUntilVisible:
    element: 'Adınız ve soyadınız'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'Adınız ve soyadınız'
- inputText: 'Ayşe Yılmaz'
# Klavye açıkken alttaki alana dokunma tutmayabiliyor: Safari klavye çubuğundaki Done ile kapat
# (hideKeyboard Safari'de forma dokunuyor), alanı ortaya getir.
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'E-posta adresiniz.*'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'E-posta adresiniz.*'
- inputText: ${output.parentEmail}
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Doğrulama kodu gönder'
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    text: 'Doğrulama kodu gönder'
    enabled: true
- tapOn: 'Doğrulama kodu gönder'
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/read-otp.js
      - assertTrue: ${output.otp && output.otp.length === 6}
- scrollUntilVisible:
    element: 'E-postanıza gelen.*'
    visibilityPercentage: 100
    centerElement: true
- tapOn: 'E-postanıza gelen.*'
- inputText: ${output.otp}
- tapOn: 'Onay veriyorum'
- extendedWaitUntil:
    visible: 'Onay verildi.*'
    timeout: 15000

# 3. Öğrenci uygulamaya döner: onay görünür, hesap bağlanır ve yedek sunucuya yazılır.
- runFlow: _relaunch.yaml
- runFlow: _connect-account.yaml
- tapOn: { id: sync-now }
- extendedWaitUntil:
    visible: { id: sync-status }
    timeout: 15000
- assertNotVisible: 'Yedeklenemedi.*'
