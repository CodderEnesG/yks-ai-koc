# T22: haftalık veli raporu. 18 yaş altı öğrenci kitap ekler ve bugünkü görevi yapar; veli onayıyla rapor
# rızası verir; öğrenci Ayarlar'dan rapor linkini alır; rapor sayfası (Safari) haftanın sayılarını gösterir.
# Yerel Supabase, `supabase functions serve` ve apps/web açık olmalı.
appId: dev.placeholder.ykskoc
---
- evalScript: ${output.parentEmail = 'veli-' + Date.now() + '@test.local'}
- runFlow: _onboard-minor.yaml
- tapOn: { id: today-add-book }
- tapOn: { id: add-quick }
- tapOn: { id: quick-title }
- inputText: 'Rapor Deneme Kitabı'
# Klavye açıkken sayı alanı yapışkan düğmenin arkasında kalır: başlığa dokunup klavyeyi kapat.
- tapOn: 'Hızlı ekle'
- tapOn: { id: quick-count }
- inputText: '120'
- tapOn: { id: continue }
- tapOn: 'Bugün'
- extendedWaitUntil:
    visible: { id: today-task }
    timeout: 10000
- tapOn: { id: checkin-done }

- runFlow:
    file: _consent-grant.yaml
    env:
      REPORT: 'true'

# Rapor linki: WhatsApp açılır (simülatörde Safari), uygulamaya dönülür ve link okunur.
- scrollUntilVisible:
    element: { id: report-share }
    visibilityPercentage: 100
    centerElement: true
- tapOn: { id: report-share }
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: { id: report-link }
    timeout: 15000
- copyTextFrom: { id: report-link }
- openLink: ${maestro.copiedText}
- extendedWaitUntil:
    visible: 'Haftalık rapor'
    timeout: 20000
- assertVisible: '1/1'
- assertVisible: 'Planlanan her günü tamamladı.'
- assertVisible: 'Rapor Deneme Kitabı'
- assertVisible: '1 gün'
- assertVisible: 'Bu hafta 40 sayfa'
