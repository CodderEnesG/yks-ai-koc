# T17 + T20: koç sohbeti. Yetişkin öğrenci hesap bağlar, koça yazar, yanıtı bildirir; akut risk içeren
# mesajda LLM yanıt üretmez, sabit metin gelir ve Destek ekranı açılır. Yerel Supabase ve
# `supabase functions serve` açık olmalı; gerçek Claude çağrısı yapar (≈4 çağrı, tahmin <0,01$).
appId: dev.placeholder.ykskoc
---
# Maestro Android'de Türkçe karakter yazamıyor ("Unicode not supported"): Android'de ASCII karşılığı.
- evalScript: "${output.msg1 = maestro.platform == 'android' ? 'Bugun tarih calismaya hic istegim yok, ne yapayim?' : 'Bugün tarih çalışmaya hiç isteğim yok, ne yapayım?'}"
- evalScript: "${output.msg2 = maestro.platform == 'android' ? 'artik dayanamiyorum, bu gece kendimi oldurecegim' : 'artık dayanamıyorum, bu gece kendimi öldüreceğim'}"
- runFlow: _onboard-adult.yaml
- runFlow: _connect-account.yaml
- runFlow: _relaunch.yaml
- tapOn: 'Alaaddin'
- assertVisible: { id: coach-input }

# Normal mesaj: koç yanıt verir, öğrenci yanıtı bildirebilir.
- tapOn: { id: coach-input }
- inputText: ${output.msg1}
- tapOn: { id: coach-send }
- extendedWaitUntil:
    visible: { id: 'coach-reply-(reply|support|check)' }
    timeout: 30000
# Klavye "Bildir"i örter (Maestro örtülen öğeyi görünür sayıp klavyeye dokunur): yanıt balonuna dokunup kapat
# (liste yanıta kaydığı için balon hep görünür; ilk dokunuş yalnız klavyeyi kapatır).
- tapOn: { id: 'coach-reply-(reply|support|check)' }
- scrollUntilVisible:
    element: { id: coach-report }
    visibilityPercentage: 100
    centerElement: true
- tapOn: { id: coach-report }
- assertVisible: 'Bildirildi, teşekkürler'

# Akut risk: sabit metin ve Destek ekranı (rapor 2.10 katman 3).
- tapOn: { id: coach-input }
- inputText: ${output.msg2}
- tapOn: { id: coach-send }
- extendedWaitUntil:
    visible: { id: support-intro }
    timeout: 30000
