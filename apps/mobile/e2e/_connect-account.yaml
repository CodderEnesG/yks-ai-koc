# Bugün'ün dişli ikonundan (Ayarlar zaten açıksa oradan) hesap bağlar; giriş kodu yerel Mailpit'ten
# okunur. output.email kullanılır. Ayarlar'da biter; sekmelere dönmek için _relaunch.yaml.
appId: dev.placeholder.ykskoc
---
- runScript: scripts/clear-mail.js
- runFlow:
    when:
      visible: { id: settings-open }
    commands:
      - tapOn: { id: settings-open }
- scrollUntilVisible:
    element: { id: account-connect }
    visibilityPercentage: 100
    centerElement: true
- tapOn: { id: account-connect }
- tapOn: { id: account-email }
- inputText: ${output.email}
- tapOn: { id: account-consent }
- tapOn: { id: continue }
- retry:
    maxRetries: 5
    commands:
      - runScript: scripts/read-otp.js
      - assertTrue: ${output.otp && output.otp.length === 6}
- tapOn: { id: account-code }
- inputText: ${output.otp}
- tapOn: { id: continue }
- extendedWaitUntil:
    visible: 'Bağlı: .*'
    timeout: 15000
