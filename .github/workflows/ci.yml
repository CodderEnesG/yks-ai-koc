name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Sürüm kök package.json'daki packageManager alanından okunur.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # plan-engine property testleri burada koşar (rapor 2.6, CI'da zorunlu).
      - run: pnpm test
      # Paylaşılan paket Supabase Edge Functions'ta (Deno) da derlenmeli.
      - run: pnpm --filter @yks/plan-engine check:deno
      - run: pnpm --filter @yks/safety check:deno
      # Her fonksiyon kendi deno.json'uyla (import map) denetlenir; _shared/ fonksiyon değil, onları
      # içe aktaran fonksiyonla birlikte denetlenir.
      - run: |
          set -e
          for dir in supabase/functions/*/; do
            case "$dir" in */_*) continue ;; esac
            deno check --config "${dir}deno.json" "${dir}index.ts"
          done

  # Supabase şeması ve RLS testleri (pgTAP). Yalnız veritabanı konteyneri başlatılır.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
